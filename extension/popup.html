<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 340px;
      min-height: 200px;
      font-family: system-ui, sans-serif;
      padding: 16px;
      margin: 0;
      background: #0f0f0f;
      color: #eee;
    }
    #decision {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .watch { color: #4ade80; }
    .skip  { color: #f87171; }
    #reason { font-size: 13px; color: #aaa; margin-bottom: 12px; }
    #score  { font-size: 12px; color: #888; margin-bottom: 12px; }
    #segments { padding-left: 16px; font-size: 12px; color: #ccc; margin-bottom: 14px; }
    #segments li { margin-bottom: 4px; }
    .topic-row { display: flex; gap: 8px; margin-bottom: 12px; }
    #topic-input {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 6px;
      color: #eee;
      padding: 6px 10px;
      font-size: 12px;
    }
    #topic-btn {
      background: #333;
      border: none;
      border-radius: 6px;
      color: #eee;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    #topic-btn:hover { background: #444; }
    .feedback-row { display: flex; gap: 10px; align-items: center; }
    .thumb {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 6px;
      color: #eee;
      padding: 5px 14px;
      font-size: 16px;
      cursor: pointer;
    }
    .thumb:hover { background: #2a2a2a; }
    #feedback-msg { font-size: 11px; color: #666; }
    #status { font-size: 13px; color: #888; padding: 20px 0; }
    #keywords { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .kw {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      font-size: 11px;
      padding: 3px 10px;
      color: #bbb;
    }
    #topic-match {
      font-size: 12px;
      color: #facc15;
      margin-bottom: 10px;
      display: none;
    }
    #error { color: #f87171; font-size: 12px; }
  </style>
</head>
<body>
  <div id="status">Analyzing...</div>
  <div id="error"></div>

  <div id="result" style="display:none">
    <div id="decision"></div>
    <div id="reason"></div>
    <div id="score"></div>
    <div id="topic-match"></div>

    <div id="keywords"></div>

    <ul id="segments"></ul>

    <div class="topic-row">
      <input id="topic-input" type="text" placeholder="Does it cover a specific topic?">
      <button id="topic-btn">Ask</button>
    </div>

    <div class="feedback-row">
      <button class="thumb" id="thumb-up">👍</button>
      <button class="thumb" id="thumb-down">👎</button>
      <span id="feedback-msg"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
